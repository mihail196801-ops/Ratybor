<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ratybor VPN</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 350px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo { font-size: 3rem; margin-bottom: 10px; }
        h1 { font-size: 1.5rem; margin-bottom: 5px; }
        .status { font-size: 0.9rem; opacity: 0.9; }
        
        .big-button {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            color: #fff;
            font-size: 4rem;
            cursor: pointer;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .big-button:hover { transform: scale(1.05); }
        .big-button:active { transform: scale(0.95); }
        .big-button.active {
            background: linear-gradient(135deg, #00d084 0%, #00a86b 100%);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 40px rgba(0,208,132,0.6); }
            50% { box-shadow: 0 0 60px rgba(0,208,132,0.8); }
        }
        .button-text {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
        }
        .info {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 15px;
            margin-top: 20px;
            text-align: center;
            font-size: 0.9rem;
        }
        .youtube-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: #ff0000;
            color: #fff;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">🛡️</div>
        <h1>Ratybor VPN</h1>
        <div class="status" id="status">Отключено</div>
    </div>
    
    <button class="big-button" id="vpnButton">
        <span>🔌</span>
    </button>
    <div class="button-text" id="buttonText">Нажмите для подключения</div>
    
    <div class="info">
        <div>✅ YouTube разблокирован</div>
        <div class="youtube-badge">▶️ YouTube</div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
