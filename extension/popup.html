<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VPN Connect</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #333;
    }
    .logo { font-size: 1.5rem; }
    h1 { font-size: 1.1rem; font-weight: 600; }
    
    .status-card {
      background: #16213e;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      text-align: center;
    }
    
    .toggle-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: none;
      background: #444;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
      transition: all 0.3s;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .toggle-btn.active {
      background: #00d084;
      box-shadow: 0 0 20px rgba(0, 208, 132, 0.5);
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    .status-text {
      font-size: 0.95rem;
      font-weight: 500;
    }
    
    .config-info {
      font-size: 0.85rem;
      opacity: 0.8;
      margin-top: 8px;
    }
    
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #4a69bd;
      color: #fff;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 10px;
      transition: background 0.2s;
    }
    
    .btn:hover { background: #3c5aa6; }
    .btn.danger { background: #e55039; }
    .btn.danger:hover { background: #c0392b; }
    
    .footer {
      margin-top: 20px;
      font-size: 0.75rem;
      opacity: 0.6;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">🛡️</span>
    <h1>VPN Connect</h1>
  </div>

  <div class="status-card">
    <button class="toggle-btn" id="toggleBtn">🔌</button>
    <div class="status-text" id="statusText">Отключено</div>
    <div class="config-info" id="configInfo">Нет активного конфига</div>
  </div>

  <button class="btn" id="openWebAppBtn">📱 Открыть Web App</button>
  <button class="btn danger" id="clearBtn">🗑️ Удалить конфиги</button>

  <div class="footer">
    v1.0.0 • Для работы требуется Telegram бот
  </div>

  <script src="popup.js"></script>
</body>
</html>
