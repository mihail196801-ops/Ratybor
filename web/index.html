<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🔐 VPN Connect</title>
  <style>
    :root {
      --bg: #0f0f13;
      --card: #1a1a24;
      --text: #e0e0ff;
      --accent: #6c5ce7;
      --accent-hover: #5a4fcf;
      --success: #00b894;
      --border: #2d2d44;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      line-height: 1.5;
    }
    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }
    .logo {
      font-size: 3rem;
      margin: 20px 0;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 10px;
      font-weight: 600;
    }
    .status {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin: 20px 0;
      font-size: 0.95rem;
    }
    .status.connected {
      border-color: var(--success);
      background: rgba(0, 184, 148, 0.1);
    }
    .btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 16px 24px;
      font-size: 1.1rem;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 10px 0;
    }
    .btn:hover { background: var(--accent-hover); transform: translateY(-2px); }
    .btn:active { transform: translateY(0); }
    .btn.secondary {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn.success {
      background: var(--success);
    }
    .config-list {
      margin-top: 25px;
      text-align: left;
    }
    .config-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      margin: 8px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }
    .config-flag { font-size: 1.2rem; margin-right: 8px; }
    .copy-btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--success);
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 500;
      transition: transform 0.3s;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .footer {
      margin-top: auto;
      padding: 20px 0;
      font-size: 0.8rem;
      opacity: 0.7;
      text-align: center;
    }
    @media (max-width: 360px) {
      .btn { padding: 14px 20px; font-size: 1rem; }
      h1 { font-size: 1.3rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🛡️</div>
    <h1>VPN Connect</h1>
    
    <div class="status" id="status">
      🔴 Статус: <strong>Отключено</strong><br>
      <small>Нажмите кнопку ниже для подключения</small>
    </div>

    <button class="btn" id="connectBtn">
      <span>⚡</span> Подключиться
    </button>
    
    <button class="btn secondary" id="copyConfigBtn">
      📋 Скопировать лучший конфиг
    </button>

    <div class="config-list" id="configList">
      <h3 style="margin: 20px 0 10px; font-size: 1.1rem;">🌍 Доступные серверы</h3>
      <!-- Конфиги загружаются динамически -->
    </div>
  </div>

  <div class="toast" id="toast">✅ Скопировано!</div>
  
  <div class="footer">
    Конфиги обновляются автоматически из GitHub.<br>
    Последнее обновление: <span id="lastUpdate">—</span>
  </div>

  <script>
    // === Настройки ===
    const CONFIGS_URL = 'configs/configs.json'; // Путь к файлу с конфигами
    const GITHUB_RAW_BASE = 'https://raw.githubusercontent.com/ваш-юзернейм/ваш-репозиторий/main';
    
    // === Состояние ===
    let isConnected = false;
    let configs = [];
    
    // === DOM элементы ===
    const connectBtn = document.getElementById('connectBtn');
    const copyConfigBtn = document.getElementById('copyConfigBtn');
    const statusEl = document.getElementById('status');
    const configListEl = document.getElementById('configList');
    const toastEl = document.getElementById('toast');
    const lastUpdateEl = document.getElementById('lastUpdate');
    
    // === Инициализация ===
    async function init() {
      await loadConfigs();
      renderConfigs();
      updateLastUpdateTime();
      
      // Обработчики кнопок
      connectBtn.addEventListener('click', toggleConnection);
      copyConfigBtn.addEventListener('click', copyBestConfig);
      
      // Telegram WebApp инициализация (если открыто в боте)
      if (window.Telegram?.WebApp) {
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
        // Меняем цвет хедера под тему
        document.body.style.background = Telegram.WebApp.backgroundColor || '#0f0f13';
      }
    }
    
    // === Загрузка конфигов из GitHub ===
    async function loadConfigs() {
      try {
        // В реальности: fetch(`${GITHUB_RAW_BASE}/web/configs/configs.json`)
        // Для демо используем заглушку - замените на реальный запрос
        const response = await fetch(CONFIGS_URL);
        if (!response.ok) throw new Error('Не удалось загрузить конфиги');
        configs = await response.json();
      } catch (e) {
        console.error('Ошибка загрузки:', e);
        // Демо-данные, если файл не найден (удалите в продакшене)
        configs = [
          { country: '🇩🇪', name: 'Germany #1', config: 'vless://uuid@de1.example.com:443...', priority: 1 },
          { country: '🇫🇮', name: 'Finland #2', config: 'vless://uuid@fi2.example.com:443...', priority: 2 },
          { country: '🇯🇵', name: 'Japan #3', config: 'vless://uuid@jp3.example.com:443...', priority: 3 }
        ];
      }
    }
    
    // === Отображение списка конфигов ===
    function renderConfigs() {
      configListEl.innerHTML = '<h3 style="margin: 20px 0 10px; font-size: 1.1rem;">🌍 Доступные серверы</h3>';
      
      // Сортируем по приоритету (меньше = лучше)
      configs.sort((a, b) => a.priority - b.priority).slice(0, 5).forEach(cfg => {
        const item = document.createElement('div');
        item.className = 'config-item';
        item.innerHTML = `
          <span><span class="config-flag">${cfg.country}</span> ${cfg.name}</span>
          <button class="copy-btn" data-config="${encodeURIComponent(cfg.config)}">Копировать</button>
        `;
        configListEl.appendChild(item);
      });
      
      // Добавляем обработчики на кнопки копирования
      document.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const config = decodeURIComponent(e.target.dataset.config);
          copyToClipboard(config);
        });
      });
    }
    
    // === Переключение подключения (визуальное) ===
    function toggleConnection() {
      isConnected = !isConnected;
      
      if (isConnected) {
        statusEl.className = 'status connected';
        statusEl.innerHTML = `🟢 Статус: <strong>Подключено</strong><br><small>Сервер: ${configs[0]?.name || 'Auto'}</small>`;
        connectBtn.innerHTML = '<span>🔴</span> Отключиться';
        connectBtn.classList.add('success');
        showToast('✅ Подключение установлено!');
      } else {
        statusEl.className = 'status';
        statusEl.innerHTML = `🔴 Статус: <strong>Отключено</strong><br><small>Нажмите кнопку для подключения</small>`;
        connectBtn.innerHTML = '<span>⚡</span> Подключиться';
        connectBtn.classList.remove('success');
      }
      
      // Вибрация для тактильного отклика (на мобильных)
      if (navigator.vibrate) navigator.vibrate(50);
    }
    
    // === Копирование лучшего конфига ===
    function copyBestConfig() {
      if (configs.length === 0) {
        showToast('❌ Нет доступных конфигов', true);
        return;
      }
      // Берем конфиг с наивысшим приоритетом (наименьшее число)
      const best = configs.sort((a, b) => a.priority - b.priority)[0];
      copyToClipboard(best.config);
      showToast(`✅ Скопирован: ${best.country} ${best.name}`);
    }
    
    // === Универсальная функция копирования ===
    function copyToClipboard(text) {
      if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }
    
    function fallbackCopy(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      try {
        document.execCommand('copy');
      } catch (e) {
        showToast('❌ Не удалось скопировать', true);
      }
      document.body.removeChild(textarea);
    }
    
    // === Показ уведомления ===
    function showToast(message, isError = false) {
      toastEl.textContent = message;
      toastEl.style.background = isError ? '#e74c3c' : '#00b894';
      toastEl.classList.add('show');
      setTimeout(() => toastEl.classList.remove('show'), 2500);
    }
    
    // === Обновление времени последнего обновления ===
    function updateLastUpdateTime() {
      const now = new Date();
      const options = { 
        day: '2-digit', month: '2-digit', 
        hour: '2-digit', minute: '2-digit',
        timeZone: 'Europe/Moscow'
      };
      lastUpdateEl.textContent = now.toLocaleString('ru-RU', options) + ' MSK';
    }
    
    // === Запуск ===
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
