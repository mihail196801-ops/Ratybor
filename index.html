<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4361ee">
    <title>🔐 Ratybor VPN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo { font-size: 3rem; margin-bottom: 10px; }
        h1 { font-size: 1.5rem; font-weight: 700; }

        .extension-card {
            background: rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid transparent;
            transition: border-color 0.3s;
        }

        .extension-card.installed {
            border-color: #00d084;
            background: rgba(0, 208, 132, 0.15);
        }

        .extension-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .extension-icon { font-size: 2rem; }
        .extension-status { font-weight: 600; font-size: 1.1rem; }
        .extension-status.installed { color: #00d084; }
        .extension-status.not-installed { color: #ff6b6b; }

        .connect-wrapper {
            display: flex;
            justify-content: center;
            margin: 30px 0;
        }

        .connect-btn {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            font-size: 3rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.4);
            position: relative;
            overflow: hidden;
        }

        .connect-btn::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .connect-btn:hover::before { opacity: 1; }
        .connect-btn:active { transform: scale(0.95); }

        .connect-btn.active {
            background: linear-gradient(135deg, #00d084 0%, #00a86b 100%);
            box-shadow: 0 10px 40px rgba(0, 208, 132, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 10px 40px rgba(0, 208, 132, 0.4); }
            50% { box-shadow: 0 10px 60px rgba(0, 208, 132, 0.7); }
        }

        .connect-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
            animation: none !important;
        }

        .connect-label {
            position: absolute;
            bottom: -30px;
            font-size: 1rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .servers-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 25px 0 15px;
        }

        .server-item {
            background: rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .server-item:hover { background: rgba(255,255,255,0.15); }
        .server-item.selected {
            background: rgba(67, 97, 238, 0.3);
            border-left: 4px solid #4361ee;
        }

        .server-info { display: flex; align-items: center; gap: 12px; }
        .server-flag { font-size: 1.5rem; }
        .server-name { font-weight: 500; }
        .server-ping { font-size: 0.85rem; opacity: 0.8; }
        
        .select-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background: #4361ee;
            color: #fff;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .select-btn.selected { background: #00d084; }

        .install-card {
            background: rgba(255, 107, 107, 0.15);
            border: 1px solid #ff6b6b;
            border-radius: 16px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
        }

        .install-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #ff6b6b;
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .install-btn:hover { background: #ee5a5a; }

        .stats {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }
        .stats.show { display: grid; }
        
        .stat-box {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }
        .stat-value { font-size: 1.3rem; font-weight: 700; }
        .stat-label { font-size: 0.8rem; opacity: 0.8; }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #fff;
            color: #1a1a2e;
            padding: 14px 24px;
            border-radius: 12px;
            font-weight: 500;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            transition: transform 0.3s;
            z-index: 1000;
            max-width: 90%;
            text-align: center;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.error { background: #ff6b6b; color: #fff; }
        .toast.success { background: #00d084; color: #fff; }

        .spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        .spinner.show { display: block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* МОБИЛЬНАЯ ВЕРСИЯ */
        @media (max-width: 480px) {
            body { padding: 15px; }
            
            .container { padding: 0 5px; }
            
            .logo { font-size: 2.5rem; }
            h1 { font-size: 1.3rem; }
            
            .connect-btn {
                width: 140px;
                height: 140px;
                font-size: 2.5rem;
            }
            
            .connect-label {
                font-size: 0.9rem;
                bottom: -25px;
            }
            
            .extension-card, .install-card {
                padding: 15px;
            }
            
            .server-item {
                padding: 12px;
            }
            
            .server-name {
                font-size: 0.95rem;
            }
            
            .server-ping {
                font-size: 0.75rem;
            }
            
            .stats {
                gap: 8px;
            }
            
            .stat-value {
                font-size: 1.1rem;
            }
            
            .stat-label {
                font-size: 0.7rem;
            }
        }

        @media (max-width: 360px) {
            .connect-btn {
                width: 120px;
                height: 120px;
                font-size: 2rem;
            }
            
            .connect-label {
                font-size: 0.8rem;
                bottom: -22px;
            }
            
            .stats {
                grid-template-columns: 1fr;
            }
            
            h1 { font-size: 1.1rem; }
            .logo { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🛡️</div>
            <h1>Ratybor VPN</h1>
        </div>

        <div class="extension-card" id="extensionCard">
            <div class="extension-header">
                <span class="extension-icon">🧩</span>
                <span class="extension-status not-installed" id="extensionStatus">
                    Расширение не установлено
                </span>
            </div>
            <div id="extensionHint" style="font-size: 0.9rem; opacity: 0.8;">
                Установите расширение для работы VPN в браузере
            </div>
        </div>

        <div class="install-card" id="installCard" style="display: none;">
            <strong>📦 Требуется расширение</strong>
            <p style="margin: 10px 0; font-size: 0.9rem; opacity: 0.9;">
                Для работы нажмите кнопку ниже и следуйте инструкциям
            </p>
            <button class="install-btn" onclick="installExtension()">
                <span>🔗</span> Установить расширение
            </button>
        </div>

        <div class="connect-wrapper">
            <button class="connect-btn" id="connectBtn" disabled>
                🔌
                <span class="connect-label" id="connectLabel">Ожидание...</span>
            </button>
        </div>

        <div class="stats" id="stats">
            <div class="stat-box">
                <div class="stat-value" id="downloadSpeed">0</div>
                <div class="stat-label">Мбит/с ↓</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="uploadSpeed">0</div>
                <div class="stat-label">Мбит/с ↑</div>
            </div>
        </div>

        <div class="servers-title">🌍 Выберите сервер</div>
        <div id="serversList"></div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let isConnected = false;
        let isExtensionInstalled = false;
        let selectedConfig = null;
        let speedInterval = null;

        const configs = [
            {
                id: 1,
                country: 'Нидерланды',
                location: 'Амстердам',
                flag: '🇳🇱',
                ping: 45,
                config: 'vless://2563b829-866c-4c0f-8270-a91cffbfe852@alb03.tcpdoor.net:443?type=xhttp&security=tls#NL'
            },
            {
                id: 2,
                country: 'Финляндия',
                location: 'Хельсинки',
                flag: '🇫🇮',
                ping: 62,
                config: 'vless://9bc2b4de-8dc1-41e8-91d6-37e2687d9eff@138.124.100.120:443#FI'
            },
            {
                id: 3,
                country: 'Германия',
                location: 'Франкфурт',
                flag: '🇩',
                ping: 38,
                config: 'vless://0576588a-41df-476f-8060-d09043b4f2bc@de-fra-6.blook.network:443#DE'
            }
        ];

        const connectBtn = document.getElementById('connectBtn');
        const connectLabel = document.getElementById('connectLabel');
        const extensionCard = document.getElementById('extensionCard');
        const extensionStatus = document.getElementById('extensionStatus');
        const extensionHint = document.getElementById('extensionHint');
        const installCard = document.getElementById('installCard');
        const serversList = document.getElementById('serversList');
        const stats = document.getElementById('stats');
        const toast = document.getElementById('toast');

        async function checkExtension() {
            return new Promise((resolve) => {
                const timeout = setTimeout(() => resolve(false), 1000);
                try {
                    if (typeof chrome !== 'undefined' && chrome.runtime) {
                        chrome.runtime.sendMessage({ action: 'GET_STATUS' }, (response) => {
                            clearTimeout(timeout);
                            resolve(!chrome.runtime.lastError);
                        });
                    } else {
                        clearTimeout(timeout);
                        resolve(false);
                    }
                } catch (e) {
                    clearTimeout(timeout);
                    resolve(false);
                }
            });
        }

        async function init() {
            renderServers();
            isExtensionInstalled = await checkExtension();
            updateExtensionUI();
            setupConnectButton();
            window.addEventListener('message', handleExtensionMessage);
            
            if (tg.HapticFeedback) {
                document.addEventListener('touchstart', () => {
                    tg.HapticFeedback.impactOccurred('light');
                }, { passive: true });
            }
        }

        function updateExtensionUI() {
            if (isExtensionInstalled) {
                extensionCard.classList.add('installed');
                extensionStatus.textContent = '✅ Расширение активно';
                extensionStatus.className = 'extension-status installed';
                extensionHint.textContent = 'Готово к работе! Выберите сервер и подключитесь.';
                installCard.style.display = 'none';
                connectBtn.disabled = false;
                connectLabel.textContent = 'Нажмите для подключения';
            } else {
                extensionCard.classList.remove('installed');
                extensionStatus.textContent = '❌ Расширение не установлено';
                extensionStatus.className = 'extension-status not-installed';
                extensionHint.textContent = 'Установите расширение для работы';
                installCard.style.display = 'block';
                connectBtn.disabled = true;
                connectLabel.textContent = 'Установите расширение';
            }
        }

        function renderServers() {
            serversList.innerHTML = configs.map(cfg => `
                <div class="server-item ${selectedConfig?.id === cfg.id ? 'selected' : ''}" onclick="selectServer(${cfg.id})">
                    <div class="server-info">
                        <span class="server-flag">${cfg.flag}</span>
                        <div>
                            <div class="server-name">${cfg.country}</div>
                            <div class="server-ping">📍 ${cfg.location} • ⚡ ${cfg.ping}ms</div>
                        </div>
                    </div>
                    <button class="select-btn ${selectedConfig?.id === cfg.id ? 'selected' : ''}">
                        ${selectedConfig?.id === cfg.id ? '✓ Выбран' : 'Выбрать'}
                    </button>
                </div>
            `).join('');
        }

        function selectServer(id) {
            selectedConfig = configs.find(c => c.id === id);
            renderServers();
            showToast(`🌍 Выбран: ${selectedConfig.flag} ${selectedConfig.country}`, 'success');
            if (isConnected) toggleConnection();
        }

        function setupConnectButton() {
            connectBtn.addEventListener('click', toggleConnection);
        }

        async function toggleConnection() {
            if (!isExtensionInstalled) {
                showToast('❌ Сначала установите расширение', 'error');
                return;
            }
            if (!selectedConfig) {
                showToast('🌍 Выберите сервер', 'error');
                return;
            }

            const btn = connectBtn;
            const icon = btn.firstChild;
            
            if (!isConnected) {
                btn.classList.add('active');
                btn.disabled = true;
                icon.textContent = '⏳';
                connectLabel.textContent = 'Подключение...';

                try {
                    await new Promise(resolve => setTimeout(resolve, 1500));
                    isConnected = true;
                    icon.textContent = '🔐';
                    connectLabel.textContent = 'Подключено';
                    stats.classList.add('show');
                    showToast(`✅ ${selectedConfig.flag} ${selectedConfig.country}`, 'success');
                    startSpeedSimulation();
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                } catch (e) {
                    showToast('❌ Ошибка подключения', 'error');
                    resetButtonState();
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                }
            } else {
                btn.classList.remove('active');
                btn.disabled = true;
                icon.textContent = '🔴';
                connectLabel.textContent = 'Отключение...';

                try {
                    await new Promise(resolve => setTimeout(resolve, 500));
                    isConnected = false;
                    icon.textContent = '🔌';
                    connectLabel.textContent = 'Нажмите для подключения';
                    stats.classList.remove('show');
                    showToast('🔌 Отключено', 'success');
                    stopSpeedSimulation();
                    if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
                } catch (e) {
                    showToast('❌ Ошибка', 'error');
                }
                resetButtonState();
            }
        }

        function resetButtonState() {
            connectBtn.disabled = false;
            if (!isConnected) {
                connectBtn.querySelector('span:first-child').textContent = '🔌';
            }
        }

        function handleExtensionMessage(event) {
            if (!event.origin.includes('t.me') && !event.origin.includes('github.io')) return;
            const { action, payload } = event.data || {};
            if (action === 'STATUS_CHANGED' && payload && payload.connected !== isConnected) {
                isConnected = payload.connected;
                updateConnectionUI();
            }
        }

        function updateConnectionUI() {
            const btn = connectBtn;
            const icon = btn.firstChild;
            if (isConnected) {
                btn.classList.add('active');
                icon.textContent = '🔐';
                connectLabel.textContent = 'Подключено';
                stats.classList.add('show');
                startSpeedSimulation();
            } else {
                btn.classList.remove('active');
                icon.textContent = '🔌';
                connectLabel.textContent = 'Нажмите для подключения';
                stats.classList.remove('show');
                stopSpeedSimulation();
            }
            btn.disabled = false;
        }

        function startSpeedSimulation() {
            speedInterval = setInterval(() => {
                document.getElementById('downloadSpeed').textContent = (Math.random() * 50 + 10).toFixed(1);
                document.getElementById('uploadSpeed').textContent = (Math.random() * 20 + 5).toFixed(1);
            }, 2000);
        }

        function stopSpeedSimulation() {
            clearInterval(speedInterval);
            document.getElementById('downloadSpeed').textContent = '0';
            document.getElementById('uploadSpeed').textContent = '0';
        }

        function installExtension() {
            const repoUrl = 'https://github.com/mihail196801-ops/Ratybor/tree/main/extension';
            
            if (window.Telegram?.WebApp) {
                Telegram.WebApp.showPopup({
                    title: '📦 Установка расширения',
                    message: '📥 ШАГИ ПО УСТАНОВКЕ:\n\n1. Нажмите "Открыть GitHub"\n\n2. Скачайте папку extension:\n   • Нажмите зеленую кнопку "Code"\n   • Выберите "Download ZIP"\n   • Распакуйте архив\n\n3. Откройте браузер:\n   • Перейдите: chrome://extensions/\n   • Включите "Режим разработчика"\n   • Нажмите "Загрузить распакованное"\n   • Выберите папку extension\n\n4. Готово! 🎉',
                    buttons: [
                        { id: 'github', type: 'default', text: '🔗 Открыть GitHub' },
                        { id: 'ok', type: 'ok', text: 'Понял' }
                    ]
                }, (buttonId) => {
                    if (buttonId === 'github') {
                        Telegram.WebApp.openLink(repoUrl);
                    }
                });
            } else {
                alert(`Откройте ссылку:\n${repoUrl}`);
                window.open(repoUrl, '_blank');
            }
        }

        function showToast(message, type = 'info') {
            toast.textContent = message;
            toast.className = `toast show ${type}`;
            setTimeout(() => { toast.className = 'toast'; }, 3000);
        }

        init();
        setInterval(async () => {
            const installed = await checkExtension();
            if (installed !== isExtensionInstalled) {
                isExtensionInstalled = installed;
                updateExtensionUI();
                showToast(isExtensionInstalled ? '✅ Расширение обнаружено!' : '❌ Расширение не найдено', 
                         isExtensionInstalled ? 'success' : 'error');
            }
        }, 5000);
    </script>
</body>
</html>
