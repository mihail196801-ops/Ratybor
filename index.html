<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4361ee">
    <title>🔐 Ratybor VPN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeIn 0.5s ease;
        }

        .logo { font-size: 3rem; margin-bottom: 10px; }
        h1 { font-size: 1.5rem; font-weight: 700; }

        .key-card {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid rgba(255,255,255,0.2);
            animation: fadeIn 0.6s ease;
        }

        .key-title {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .key-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 12px;
            background: rgba(255,255,255,0.2);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            text-align: center;
            letter-spacing: 3px;
            text-transform: uppercase;
            outline: none;
            transition: border-color 0.3s;
        }

        .key-input::placeholder {
            color: rgba(255,255,255,0.5);
            letter-spacing: normal;
            text-transform: none;
        }

        .key-input:focus {
            border-color: #00d084;
        }

        .download-card {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            animation: fadeIn 0.7s ease;
        }

        .download-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #00d084 0%, #00a86b 100%);
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .download-btn:hover { transform: translateY(-2px); }
        .download-btn:active { transform: translateY(0); }

        .connect-wrapper {
            display: flex;
            justify-content: center;
            margin: 30px 0;
            animation: fadeIn 0.8s ease;
        }

        .connect-btn {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            font-size: 3rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.4);
            position: relative;
            overflow: hidden;
        }

        .connect-btn::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .connect-btn:hover::before { opacity: 1; }
        .connect-btn:active { transform: scale(0.95); }

        .connect-btn.active {
            background: linear-gradient(135deg, #00d084 0%, #00a86b 100%);
            box-shadow: 0 10px 40px rgba(0, 208, 132, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 10px 40px rgba(0, 208, 132, 0.4); }
            50% { box-shadow: 0 10px 60px rgba(0, 208, 132, 0.7); }
        }

        .connect-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
            animation: none !important;
        }

        .connect-label {
            position: absolute;
            bottom: -30px;
            font-size: 1rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .activation-status {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 15px;
            margin: 20px 0;
            text-align: center;
            display: none;
        }

        .activation-status.show { display: block; }
        .activation-status.success { border: 2px solid #00d084; }
        .activation-status.error { border: 2px solid #ff6b6b; }

        .servers-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 25px 0 15px;
            animation: fadeIn 0.9s ease;
        }

        .server-item {
            background: rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
            animation: fadeIn 1s ease;
        }

        .server-item:hover { background: rgba(255,255,255,0.15); }
        .server-item.selected {
            background: rgba(67, 97, 238, 0.3);
            border-left: 4px solid #4361ee;
        }

        .server-info { display: flex; align-items: center; gap: 12px; }
        .server-flag { font-size: 1.5rem; }
        .server-name { font-weight: 500; }
        .server-ping { font-size: 0.85rem; opacity: 0.8; }
        
        .select-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background: #4361ee;
            color: #fff;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .select-btn.selected { background: #00d084; }

        .stats {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }
        .stats.show { display: grid; }
        
        .stat-box {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }
        .stat-value { font-size: 1.3rem; font-weight: 700; }
        .stat-label { font-size: 0.8rem; opacity: 0.8; }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #fff;
            color: #1a1a2e;
            padding: 14px 24px;
            border-radius: 12px;
            font-weight: 500;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            transition: transform 0.3s;
            z-index: 1000;
            max-width: 90%;
            text-align: center;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.error { background: #ff6b6b; color: #fff; }
        .toast.success { background: #00d084; color: #fff; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            body { padding: 15px; }
            .connect-btn { width: 140px; height: 140px; font-size: 2.5rem; }
            .connect-label { font-size: 0.9rem; bottom: -25px; }
            .key-input { font-size: 1rem; padding: 12px; }
        }

        @media (max-width: 360px) {
            .connect-btn { width: 120px; height: 120px; font-size: 2rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🛡️</div>
            <h1>Ratybor VPN</h1>
        </div>

        <div class="key-card">
            <div class="key-title">🔑 Введите ваш ключ доступа</div>
            <input 
                type="text" 
                class="key-input" 
                id="accessKey" 
                placeholder="XXXXXXXX"
                maxlength="8"
                autocomplete="off"
            >
            <div class="activation-status" id="activationStatus">
                <span id="activationMessage"></span>
            </div>
        </div>

        <div class="download-card">
            <div class="key-title">📦 Скачать расширение</div>
            <button class="download-btn" onclick="showDownloadInstructions()">
                <span>⬇️</span> Инструкция по установке
            </button>
            <p style="margin-top: 10px; font-size: 0.85rem; opacity: 0.8;">
                Для Chrome, Edge, Яндекс.Браузер
            </p>
        </div>

        <div class="connect-wrapper">
            <button class="connect-btn" id="connectBtn" disabled>
                🔌
                <span class="connect-label" id="connectLabel">Введите ключ</span>
            </button>
        </div>

        <div class="stats" id="stats">
            <div class="stat-box">
                <div class="stat-value" id="downloadSpeed">0</div>
                <div class="stat-label">Мбит/с ↓</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="uploadSpeed">0</div>
                <div class="stat-label">Мбит/с ↑</div>
            </div>
        </div>

        <div class="servers-title">🌍 Выберите сервер</div>
        <div id="serversList"></div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const API_URL = 'http://localhost:8080';

        let isConnected = false;
        let isActivated = false;
        let accessKey = '';
        let selectedConfig = null;
        let speedInterval = null;

        const configs = [
            { id: 1, country: 'Нидерланды', location: 'Амстердам', flag: '🇳🇱', ping: 45 },
            { id: 2, country: 'Финляндия', location: 'Хельсинки', flag: '🇫🇮', ping: 62 },
            { id: 3, country: 'Германия', location: 'Франкфурт', flag: '🇩🇪', ping: 38 }
        ];

        const accessKeyInput = document.getElementById('accessKey');
        const activationStatus = document.getElementById('activationStatus');
        const activationMessage = document.getElementById('activationMessage');
        const connectBtn = document.getElementById('connectBtn');
        const connectLabel = document.getElementById('connectLabel');
        const serversList = document.getElementById('serversList');
        const stats = document.getElementById('stats');
        const toast = document.getElementById('toast');

        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('ratybor_key');
            const isActivated = localStorage.getItem('ratybor_activated');
            
            if (savedKey && isActivated === 'true') {
                accessKeyInput.value = savedKey;
                activateUI();
            }
            renderServers();
        });

        accessKeyInput.addEventListener('input', (e) => {
            accessKey = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
            e.target.value = accessKey;

            if (accessKey.length === 8) {
                validateKey(accessKey);
            } else {
                resetActivation();
            }
        });

        async function validateKey(key) {
            activationStatus.className = 'activation-status show';
            activationMessage.textContent = '⏳ Проверка...';
            
            try {
                const validateResponse = await fetch(`${API_URL}/api/validate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key: key })
                });
                
                const validateData = await validateResponse.json();
                
                if (!validateData.success) {
                    throw new Error(validateData.error || 'Ключ недействителен');
                }
                
                const deviceId = 'webapp_' + (tg.initDataUnsafe?.user?.id || Date.now());
                
                const activateResponse = await fetch(`${API_URL}/api/activate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key: key, device_id: deviceId })
                });
                
                const activateData = await activateResponse.json();
                
                if (!activateData.success) {
                    throw new Error(activateData.error || 'Не удалось активировать');
                }
                
                activationStatus.className = 'activation-status show success';
                activationMessage.textContent = '✅ Ключ активирован!';
                isActivated = true;
                connectBtn.disabled = false;
                connectLabel.textContent = 'Нажмите для подключения';
                showToast('🔑 Ключ активирован!', 'success');
                
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                
                localStorage.setItem('ratybor_key', key);
                localStorage.setItem('ratybor_activated', 'true');
                
            } catch (error) {
                activationStatus.className = 'activation-status show error';
                activationMessage.textContent = '❌ ' + error.message;
                isActivated = false;
                connectBtn.disabled = true;
                showToast('❌ ' + error.message, 'error');
                
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            }
        }

        function resetActivation() {
            activationStatus.className = 'activation-status';
            isActivated = false;
            connectBtn.disabled = true;
            connectLabel.textContent = 'Введите ключ';
        }

        function activateUI() {
            isActivated = true;
            connectBtn.disabled = false;
            connectLabel.textContent = 'Нажмите для подключения';
            activationStatus.className = 'activation-status show success';
            activationMessage.textContent = '✅ Ключ активирован!';
        }

        function showDownloadInstructions() {
            window.open('https://disk.yandex.ru/d/a-UcZrmlY6v2og', '_blank');
            showToast('⬇️ Открываю инструкцию...', 'success');
        }

        function renderServers() {
            serversList.innerHTML = configs.map(cfg => `
                <div class="server-item ${selectedConfig?.id === cfg.id ? 'selected' : ''}" onclick="selectServer(${cfg.id})">
                    <div class="server-info">
                        <span class="server-flag">${cfg.flag}</span>
                        <div>
                            <div class="server-name">${cfg.country}</div>
                            <div class="server-ping">📍 ${cfg.location} • ⚡ ${cfg.ping}ms</div>
                        </div>
                    </div>
                    <button class="select-btn ${selectedConfig?.id === cfg.id ? 'selected' : ''}">
                        ${selectedConfig?.id === cfg.id ? '✓ Выбран' : 'Выбрать'}
                    </button>
                </div>
            `).join('');
        }

        function selectServer(id) {
            selectedConfig = configs.find(c => c.id === id);
            renderServers();
            showToast(`🌍 Выбран: ${selectedConfig.flag} ${selectedConfig.country}`, 'success');
        }

        async function toggleConnection() {
            if (!isActivated) {
                showToast('❌ Введите и активируйте ключ', 'error');
                return;
            }
            if (!selectedConfig) {
                showToast('🌍 Выберите сервер', 'error');
                return;
            }

            const btn = connectBtn;
            const icon = btn.firstChild;
            
            if (!isConnected) {
                btn.classList.add('active');
                btn.disabled = true;
                icon.textContent = '⏳';
                connectLabel.textContent = 'Подключение...';

                await new Promise(resolve => setTimeout(resolve, 1500));
                
                isConnected = true;
                icon.textContent = '🔐';
                connectLabel.textContent = 'Подключено';
                stats.classList.add('show');
                showToast(`✅ ${selectedConfig.flag} ${selectedConfig.country}`, 'success');
                startSpeedSimulation();
                
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            } else {
                btn.classList.remove('active');
                btn.disabled = true;
                icon.textContent = '🔴';
                connectLabel.textContent = 'Отключение...';

                await new Promise(resolve => setTimeout(resolve, 500));
                
                isConnected = false;
                icon.textContent = '🔌';
                connectLabel.textContent = 'Нажмите для подключения';
                stats.classList.remove('show');
                showToast('🔌 Отключено', 'success');
                stopSpeedSimulation();
                
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            }
            
            btn.disabled = false;
        }

        function startSpeedSimulation() {
            speedInterval = setInterval(() => {
                document.getElementById('downloadSpeed').textContent = (Math.random() * 50 + 10).toFixed(1);
                document.getElementById('uploadSpeed').textContent = (Math.random() * 20 + 5).toFixed(1);
            }, 2000);
        }

        function stopSpeedSimulation() {
            clearInterval(speedInterval);
            document.getElementById('downloadSpeed').textContent = '0';
            document.getElementById('uploadSpeed').textContent = '0';
        }

        function showToast(message, type = 'info') {
            toast.textContent = message;
            toast.className = `toast show ${type}`;
            setTimeout(() => { toast.className = 'toast'; }, 3000);
        }

        connectBtn.addEventListener('click', toggleConnection);
    </script>
</body>
</html>
